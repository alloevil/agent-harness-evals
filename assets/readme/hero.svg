<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="t d">
  <title id="t">agent-harness-evals: same model, different harness, different score</title>
  <desc id="d">Live matrix showing claude-opus-4.6 scoring 0.580 under Claude Code and 0.699 under Droid on terminal-bench — a 0.218 spread controlled by the harness alone. Median spread 13.5 points across 22 models.</desc>
  <defs>
    <style>
      .t  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s  { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1240" height="420" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1239" height="419" rx="16" fill="none" stroke="#21262d"/>

  <!-- title block -->
  <g id="title-block">
    <text x="64" y="96" class="t" font-size="44" font-weight="700" fill="#e6edf3">agent-harness-evals</text>
    <text x="64" y="148" class="s" font-size="26" fill="#58a6ff" font-weight="600">Same model. Different harness. Different score.</text>
    <text x="64" y="192" class="s" font-size="20" fill="#8b949e">The model × harness matrix, harness rankings, and</text>
    <text x="64" y="220" class="s" font-size="20" fill="#8b949e">model rankings that single leaderboards hide —</text>
    <text x="64" y="248" class="s" font-size="20" fill="#8b949e">rebuilt daily from Epoch AI and HAL data.</text>
  </g>

  <!-- pipeline strip -->
  <g id="pipeline" class="t" font-size="18">
    <rect x="64" y="290" width="100" height="40" rx="8" fill="#161b22" stroke="#21262d"/>
    <text x="114" y="316" fill="#e6edf3" text-anchor="middle">fetch</text>
    <text x="178" y="316" fill="#8b949e">→</text>
    <rect x="202" y="290" width="140" height="40" rx="8" fill="#161b22" stroke="#21262d"/>
    <text x="272" y="316" fill="#e6edf3" text-anchor="middle">normalize</text>
    <text x="356" y="316" fill="#8b949e">→</text>
    <rect x="380" y="290" width="236" height="40" rx="8" fill="#161b22" stroke="#58a6ff"/>
    <text x="498" y="316" fill="#58a6ff" text-anchor="middle">matrix · rankings</text>
  </g>
  <text x="64" y="368" class="s" font-size="17" fill="#8b949e">5,499 records · 83 benchmarks · 42 models × 50 harnesses · data CC-BY Epoch AI + HAL</text>

  <!-- project proof: real terminal-bench cells, site's blue heat ramp -->
  <g id="project-proof" transform="translate(650,84)">
    <text x="0" y="0" class="t" font-size="19" fill="#8b949e">terminal-bench · pass rate</text>

    <g class="t" font-size="18" fill="#8b949e">
      <text x="248" y="36" text-anchor="middle">Claude</text>
      <text x="248" y="58" text-anchor="middle">Code</text>
      <text x="342" y="36" text-anchor="middle">Terminus</text>
      <text x="342" y="58" text-anchor="middle">2</text>
      <text x="436" y="36" text-anchor="middle">Mux</text>
      <text x="530" y="36" text-anchor="middle">Droid</text>
    </g>

    <!-- row 1: claude-opus-4.6 (real: .580 .629 .665 .699, spread .218) -->
    <text x="0" y="102" class="t" font-size="19" fill="#e6edf3">claude-opus-4.6</text>
    <rect x="204" y="78" width="88" height="38" rx="6" fill="#1c5cab"/>
    <text x="248" y="103" class="t" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">.580</text>
    <rect x="298" y="78" width="88" height="38" rx="6" fill="#256abf"/>
    <text x="342" y="103" class="t" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">.629</text>
    <rect x="392" y="78" width="88" height="38" rx="6" fill="#2a78d6"/>
    <text x="436" y="103" class="t" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">.665</text>
    <rect x="486" y="78" width="88" height="38" rx="6" fill="#5598e7" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <text x="530" y="103" class="t" font-size="19" font-weight="700" fill="#0b1220" text-anchor="middle">.699</text>

    <!-- row 2: gpt-5.3-codex (real: .647 .746 .773; not run under Claude Code) -->
    <text x="0" y="152" class="t" font-size="19" fill="#e6edf3">gpt-5.3-codex</text>
    <rect x="204" y="128" width="88" height="38" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="248" y="153" class="t" font-size="19" fill="#8b949e" text-anchor="middle">—</text>
    <rect x="298" y="128" width="88" height="38" rx="6" fill="#256abf"/>
    <text x="342" y="153" class="t" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">.647</text>
    <rect x="392" y="128" width="88" height="38" rx="6" fill="#6da7ec"/>
    <text x="436" y="153" class="t" font-size="19" font-weight="700" fill="#0b1220" text-anchor="middle">.746</text>
    <rect x="486" y="128" width="88" height="38" rx="6" fill="#86b6ef" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5"/>
    <text x="530" y="153" class="t" font-size="19" font-weight="700" fill="#0b1220" text-anchor="middle">.773</text>

    <!-- spread callout -->
    <path d="M 248 186 L 248 206 L 530 206 L 530 186" fill="none" stroke="#58a6ff" stroke-width="2"/>
    <text x="287" y="238" class="t" font-size="21" font-weight="700" fill="#58a6ff" text-anchor="middle">spread 0.218 — the harness's share</text>
    <text x="287" y="266" class="s" font-size="17" fill="#8b949e" text-anchor="middle">median spread across 22 models: 13.5 pts</text>
  </g>
</svg>
