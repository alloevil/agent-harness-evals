<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-labelledby="s-title s-desc">
  <title id="s-title">Record schema: one unified row per benchmark, model, scaffold and score</title>
  <desc id="s-desc">The five schema fields the pipeline writes for every score: benchmark; model and model_raw; scaffold; score and score_unit; source and source_link. The raw ids claude-sonnet-4-5-20250929 (Epoch) and Claude Sonnet 4.5 High (September 2025) (HAL) are reconciled onto the single canonical id claude-sonnet-4.5, so cross-source rows join instead of fragmenting.</desc>

  <rect width="1200" height="140" rx="16" fill="#0e1319"/>
  <rect x="0.5" y="0.5" width="1199" height="139" rx="16" fill="none" stroke="#232c36"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="44" font-size="18" fill="#f0a63a">RECORD SCHEMA</text>
    <text x="64" y="76" font-size="20" fill="#e9eef4">one record per (benchmark, model, scaffold, score)</text>
    <text x="64" y="104" font-size="18" fill="#8a95a1">claude-sonnet-4-5-20250929 &#8594; claude-sonnet-4.5</text>
  </g>

  <g id="field-stack" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#e9eef4">
    <rect x="690" y="22" width="129" height="30" rx="6" fill="#151c24" stroke="#232c36"/>
    <text x="706" y="42">benchmark</text>
    <rect x="831" y="22" width="216" height="30" rx="6" fill="#151c24" stroke="#232c36"/>
    <text x="847" y="42">model &#183; model_raw</text>

    <rect x="690" y="60" width="118" height="30" rx="6" fill="#151c24" stroke="#232c36"/>
    <text x="706" y="80">scaffold</text>
    <rect x="820" y="60" width="216" height="30" rx="6" fill="#151c24" stroke="#232c36"/>
    <text x="836" y="80">score &#183; score_unit</text>

    <rect x="690" y="98" width="237" height="30" rx="6" fill="#151c24" stroke="#f0a63a"/>
    <text x="706" y="118" fill="#f0a63a">source &#183; source_link</text>
  </g>
</svg>
